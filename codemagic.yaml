workflows:
  neoslice-macos:
    name: neoSlice — Build macOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set Python 3.12
        script: |
          pyenv install 3.12 --skip-existing
          pyenv global 3.12
          python3 --version

      - name: Generate .icns icon
        script: |
          pip3 install pillow --quiet
          python3 make_icns.py

      - name: Install dependencies
        script: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build .app with PyInstaller
        script: |
          pyinstaller --clean -y neoslice_mac.spec

      - name: Thin universal2 binaries to arm64 (halves PySide6 size)
        script: |
          APP="dist/neoSlice.app"
          echo "Avant thin: $(du -sh $APP)"
          # Trouver TOUS les binaires Mach-O : .dylib, .so, et binaires sans extension dans .framework
          find "$APP" -type f | while read f; do
            file_type=$(file "$f" 2>/dev/null)
            if echo "$file_type" | grep -q "Mach-O universal binary"; then
              lipo "$f" -thin arm64 -output "$f" 2>/dev/null && echo "Thinned: $(basename $f)"
            fi
          done
          echo "Après thin: $(du -sh $APP)"

      - name: Read version
        script: |
          export APP_VERSION=$(python3 -c "from version import __version__; print(__version__)")
          echo "Version: $APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV

      - name: Create DMG (drag-to-Applications)
        script: |
          echo "=== Contenu dist/ ==="
          ls -lh dist/
          mkdir -p /tmp/dmg_src
          cp -r dist/neoSlice.app /tmp/dmg_src/
          ln -s /Applications /tmp/dmg_src/Applications
          hdiutil create \
            -volname "neoSlice" \
            -srcfolder /tmp/dmg_src \
            -ov -format UDZO \
            dist/neoSlice-v${APP_VERSION}-macOS.dmg
          echo "DMG créé: $(du -sh dist/neoSlice-v${APP_VERSION}-macOS.dmg)"

      - name: Create ZIP (auto-update)
        script: |
          cd dist
          # `zip -r` SUIT les liens symboliques et en recopie la cible. Or un
          # bundle .app de PyInstaller est bâti sur des liens : Contents/Resources
          # pointe sur Contents/Frameworks. Résultat mesuré sur la 2.3.1 : 78 % du
          # contenu dupliqué, 1,91 Go à télécharger et 6,46 Go une fois décompressé,
          # soit 8,4 Go de place nécessaire. Des utilisateurs Mac n'arrivaient tout
          # simplement pas à décompresser le fichier.
          # (Signalé par Yannick Lebeau Fraisse, MacBook Air M4, 2026-09-30.)
          #
          # `ditto -c -k` est l'outil d'Apple pour archiver un bundle : il garde les
          # liens, les permissions et les attributs étendus.
          ditto -c -k --keepParent neoSlice.app neoSlice-v${APP_VERSION}-macOS.zip
          echo "ZIP créé: $(du -sh neoSlice-v${APP_VERSION}-macOS.zip)"
          ls -lh *.dmg *.zip

      - name: Verify ZIP keeps symlinks
        script: |
          cd dist
          ZIP="neoSlice-v${APP_VERSION}-macOS.zip"
          # Garde-fou : si l'archivage reperd les liens, l'archive regonfle de
          # 0,4 Go à 1,9 Go sans que rien ne casse visiblement. On refuse alors
          # la construction plutôt que de publier une archive de 1,9 Go.
          # zipinfo marque les liens symboliques par un « l » en tête des droits.
          LIENS=$(zipinfo -l "$ZIP" | grep -c '^l' || true)
          TAILLE=$(stat -f%z "$ZIP")
          echo "Liens symboliques : $LIENS   Taille : $TAILLE octets"
          if [ "$LIENS" -lt 50 ]; then
            echo "ERREUR : les liens du bundle ont été déroulés."
            exit 1
          fi
          if [ "$TAILLE" -gt 1200000000 ]; then
            echo "ERREUR : archive de plus de 1,2 Go, attendu autour de 0,4 Go."
            exit 1
          fi

    artifacts:
      - dist/neoSlice-v*-macOS.dmg
      - dist/neoSlice-v*-macOS.zip
