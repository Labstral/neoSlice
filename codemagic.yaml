workflows:
  neoslice-macos:
    name: neoSlice — Build macOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set Python 3.12
        script: |
          pyenv install 3.12 --skip-existing
          pyenv global 3.12
          python3 --version

      - name: Generate .icns icon
        script: |
          pip3 install pillow --quiet
          python3 make_icns.py

      - name: Install dependencies
        script: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build .app with PyInstaller
        script: |
          pyinstaller --clean -y neoslice_mac.spec

      - name: Thin universal2 binaries to arm64 (halves PySide6 size)
        script: |
          echo "Avant thin: $(du -sh dist/neoSlice.app)"
          find dist/neoSlice.app -type f \( -name "*.dylib" -o -name "*.so" \) | while read f; do
            archs=$(lipo -info "$f" 2>/dev/null | grep -oE "(x86_64|arm64)" | tr '\n' ' ' || true)
            if echo "$archs" | grep -q "x86_64" && echo "$archs" | grep -q "arm64"; then
              lipo "$f" -thin arm64 -output "$f" 2>/dev/null || true
            fi
          done
          echo "Après thin: $(du -sh dist/neoSlice.app)"

      - name: Create DMG (drag-to-Applications)
        script: |
          mkdir -p /tmp/dmg_src
          cp -r dist/neoSlice.app /tmp/dmg_src/
          ln -s /Applications /tmp/dmg_src/Applications
          hdiutil create \
            -volname "neoSlice" \
            -srcfolder /tmp/dmg_src \
            -ov -format UDZO \
            dist/neoSlice-macOS.dmg
          echo "DMG: $(du -sh dist/neoSlice-macOS.dmg)"

    artifacts:
      - dist/neoSlice-macOS.dmg
