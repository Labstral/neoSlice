workflows:
  neoslice-macos:
    name: neoSlice — Build macOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set Python 3.12
        script: |
          pyenv install 3.12 --skip-existing
          pyenv global 3.12
          python3 --version

      - name: Generate .icns icon
        script: |
          pip3 install pillow --quiet
          python3 make_icns.py

      - name: Install dependencies
        script: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build .app with PyInstaller
        script: |
          pyinstaller --clean -y neoslice_mac.spec

      - name: Create DMG installer (drag-to-Applications)
        script: |
          # Préparer le contenu du DMG
          mkdir -p /tmp/dmg_src
          cp -r dist/neoSlice.app /tmp/dmg_src/
          ln -s /Applications /tmp/dmg_src/Applications

          # hdiutil est natif macOS — aucune installation requise
          hdiutil create \
            -volname "neoSlice" \
            -srcfolder /tmp/dmg_src \
            -ov \
            -format UDZO \
            dist/neoSlice-macOS.dmg

          echo "DMG: $(du -sh dist/neoSlice-macOS.dmg)"

    artifacts:
      - dist/neoSlice-macOS.dmg
