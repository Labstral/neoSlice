workflows:
  neoslice-macos:
    name: neoSlice — Build macOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set Python 3.12
        script: |
          pyenv install 3.12 --skip-existing
          pyenv global 3.12
          python3 --version

      - name: Generate .icns icon
        script: |
          mkdir -p assets/neoSlice.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/neoSlice.png \
              --out assets/neoSlice.iconset/icon_${size}x${size}.png
          done
          sips -z 32  32  assets/neoSlice.png --out assets/neoSlice.iconset/icon_16x16@2x.png
          sips -z 64  64  assets/neoSlice.png --out assets/neoSlice.iconset/icon_32x32@2x.png
          sips -z 256 256 assets/neoSlice.png --out assets/neoSlice.iconset/icon_128x128@2x.png
          sips -z 512 512 assets/neoSlice.png --out assets/neoSlice.iconset/icon_256x256@2x.png
          sips -z 1024 1024 assets/neoSlice.png --out assets/neoSlice.iconset/icon_512x512@2x.png
          iconutil -c icns assets/neoSlice.iconset -o assets/neoSlice.icns
          echo "Icon generated: $(du -sh assets/neoSlice.icns)"

      - name: Install dependencies
        script: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build .app with PyInstaller
        script: |
          pyinstaller --clean -y neoslice_mac.spec

      - name: Zip .app for download
        script: |
          cd dist
          zip -r neoSlice-macOS.zip neoSlice.app
          echo "Build size: $(du -sh neoSlice-macOS.zip)"

    artifacts:
      - dist/neoSlice-macOS.zip
