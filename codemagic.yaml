workflows:
  neoslice-macos:
    name: neoSlice — Build macOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set Python 3.12
        script: |
          pyenv install 3.12 --skip-existing
          pyenv global 3.12
          python3 --version

      - name: Generate .icns icon
        script: |
          pip3 install pillow --quiet
          python3 make_icns.py

      - name: Install dependencies
        script: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build .app with PyInstaller
        script: |
          pyinstaller --clean -y neoslice_mac.spec

      - name: Create DMG installer (drag-to-Applications)
        script: |
          brew install create-dmg --quiet

          create-dmg \
            --volname "neoSlice" \
            --volicon "assets/neoSlice.icns" \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 128 \
            --icon "neoSlice.app" 160 180 \
            --hide-extension "neoSlice.app" \
            --app-drop-link 440 180 \
            --no-internet-enable \
            "dist/neoSlice-macOS.dmg" \
            "dist/neoSlice.app"

          echo "DMG size: $(du -sh dist/neoSlice-macOS.dmg)"

    artifacts:
      - dist/neoSlice-macOS.dmg
