name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .app
        run: pyinstaller --clean -y neoslice_mac.spec

      - name: Zip .app for download
        run: |
          cd dist
          zip -r neoSlice-macOS.zip neoSlice.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoSlice-macOS
          path: dist/neoSlice-macOS.zip
          retention-days: 30
          overwrite: true
